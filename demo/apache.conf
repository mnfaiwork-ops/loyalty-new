Listen ${PORT}

<VirtualHost *:${PORT}>
    DocumentRoot ${APP_ROOT}/public

    <Directory ${APP_ROOT}/public>
        AllowOverride All
        Require all granted
    </Directory>

    # Server demo tidak boleh muncul di mesin pencari.
    Header always set X-Robots-Tag "noindex, nofollow"

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
